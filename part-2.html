<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>part-2</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link rel="stylesheet" href="part-2.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="logo.png" alt="logo" width="50">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation"> <span class="navbar-toggler-icon"></span> </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="part-1.html">Part-1</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="part-2.html">Part-2</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="part-3.html">Part-3</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    </header>
    <main class="main">
        
        <div class="container mt-4">

            <h2>Contact Form</h2>

            <form>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fname" class="form-label">Name</label>
                        <input
                            type="text"
                            class="form-control is-valid"
                            placeholder="Enter your name"
                            required
                            minlength="2"
                            maxlength="30">
                        <div class="valid-feedback">
                            Looks good!
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="femail" class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-control is-invalid"
                            id="femail"
                            placeholder="Enter your email"
                            required>
                        <div class="form-text">
                            Enter a valid email.
                        </div>
                        <div class="invalid-feedback">
                            Email is required.
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="fmessage" class="form-label">Message</label>
                    <textarea
                        class="form-control"
                        id="fmessage"
                        rows="4"
                        placeholder="Enter your message"
                        required
                        maxlength="150"></textarea>
                    <div class="invalid-feedback">
                        Message is required.
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">
                    Submit
                </button>
            </form>
        </div>
        <div>

        </div>

    </main>
</body>
</html>
