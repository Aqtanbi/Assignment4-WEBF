<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>part-3</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link rel="stylesheet" href="part-3.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="logo.png" alt="logo" width="50">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation"> <span class="navbar-toggler-icon"></span> </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="part-1.html">Part-1</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="part-2.html">Part-2</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link  active" href="part-3.html">Part-3</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    </header>
    <main class="main">

        <div class="container">

            <form>

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label for="fname" class="form-label">
                            First Name:
                        </label>

                        <input 
                            type="text"
                            class="form-control"
                            id="fname"
                            name="fname"
                            placeholder="First name"
                            required
                            maxlength="20">
                    </div>


                    <div class="col-md-6">
                        <label for="lname" class="form-label">
                            Last Name:
                        </label>

                        <input 
                            type="text"
                            class="form-control"
                            id="lname"
                            name="lname"
                            placeholder="Last name"
                            required
                            maxlength="20">
                    </div>

                </div>


                <div class="row mb-3">

                    <div class="col-12">

                        <label for="email" class="form-label">
                            Email:
                        </label>

                        <input 
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="example@gmail.com"
                            required>

                    </div>

                </div>


                <div class="row mb-3">

                    <div class="col-md-6">

                        <label for="pwd" class="form-label">
                            Password:
                        </label>

                        <input 
                            type="password"
                            class="form-control"
                            id="pwd"
                            name="pwd"
                            minlength="8"
                            maxlength="20"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label for="pwd-conf" class="form-label">
                            Confirm Password:
                        </label>

                        <input 
                            type="password"
                            class="form-control"
                            id="pwd-conf"
                            name="pwd-conf"
                            minlength="8"
                            maxlength="20"
                            required>

                    </div>

                </div>


                <div class="row mb-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Select gender:
                        </label>

                        <div class="form-check">
                            <input 
                                class="form-check-input"
                                type="radio"
                                name="gender"
                                id="female">

                            <label class="form-check-label" for="female">
                                Female
                            </label>
                        </div>


                        <div class="form-check">
                            <input 
                                class="form-check-input"
                                type="radio"
                                name="gender"
                                id="male">

                            <label class="form-check-label" for="male">
                                Male
                            </label>
                        </div>

                    </div>


                    <div class="col-md-6">

                        <label for="country" class="form-label">
                            Country:
                        </label>

                        <select 
                            class="form-select"
                            id="country"
                            required>

                            <option value="">
                                Select your country
                            </option>

                            <option>
                                Kazakhstan
                            </option>

                            <option>
                                United States
                            </option>

                            <option>
                                France
                            </option>

                            <option>
                                Italy
                            </option>

                            <option>
                                Germany
                            </option>

                            <option>
                                China
                            </option>

                        </select>

                    </div>

                </div>


                <div class="row mb-3">

                    <div class="col-12">

                        <label class="form-label">
                            Hobbies:
                        </label>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="music">
                            <label class="form-check-label" for="music">
                                Listening music
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="books">
                            <label class="form-check-label" for="books">
                                Reading books
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="games">
                            <label class="form-check-label" for="games">
                                Playing videogames
                            </label>
                        </div>

                    </div>

                </div>


                <div class="row">

                    <div class="col-md-6">
                        <button 
                            type="reset"
                            class="btn btn-secondary w-100">
                            Reset
                        </button>
                    </div>


                    <div class="col-md-6">
                        <button 
                            type="submit"
                            class="btn btn-primary w-100">
                            Submit
                        </button>
                    </div>

                </div>


            </form>

        </div>

    </main>
</body>
</html>
